<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мои победы</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Победы">
<meta name="theme-color" content="#fdfbf0" id="tcolor">
<script>try{var _t=localStorage.getItem('pobedy_theme')
  ||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap">
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:light;
  --bg:#eceadd; --paper:#fdfbf0; --card:#fff; --hover:#f0eee0; --track:#e7e5d7;
  --ink:#2b2b2b; --soft:#8d8d86; --hair:#c9c7bb; --empty:#c4c2b6;
  --sun:#ffd93d; --sun2:#ffc400; --ins-bg:#f1f3f9; --ins-br:#9aa3b8;
  --btn:linear-gradient(180deg,#ffe066,#ffc400); --btn-fg:#2b2b2b; --btn-br:#2b2b2b;
  --auth:#fff6d8; --authin:#eefaf1; --authin-br:#9ad9ae; --ok:#22b455;
  --mid:#fffbe8; --mid-hov:#fff6d0;
  --del-br:#f2a49d; --del-fg:#d9503f;
  --shadow:rgba(0,0,0,.18); --veil:rgba(40,38,30,.42); --modal:#fdfbf0;
  --yr0:#e7e5d7; --yr1:#c6ebd0; --yr2:#86d6a0; --yr3:#3fbf6a; --yr4:#178f45;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#100f0d; --paper:#1e1d19; --card:#2a2924; --hover:#34332c; --track:#34332c;
  --ink:#efece0; --soft:#918f83; --hair:#4b4941; --empty:#46443c;
  --sun:#f2c53b; --sun2:#d9a500; --ins-bg:#30343f; --ins-br:#c3cbdc;
  --btn:linear-gradient(180deg,#f5cf4d,#dba700); --btn-fg:#2b2411; --btn-br:#6b5410;
  --auth:#3a3018; --authin:#1c3123; --authin-br:#2f6b45; --ok:#3ac96c;
  --mid:#2c2718; --mid-hov:#38311e;
  --del-br:#7a3a35; --del-fg:#ff8375;
  --shadow:rgba(0,0,0,.55); --veil:rgba(6,6,4,.62); --modal:#27261f;
  --yr0:#34332c; --yr1:#1f4a2e; --yr2:#2a7a48; --yr3:#36a862; --yr4:#56e07a;
}
body{
  background:var(--bg); min-height:100vh; display:flex; justify-content:center;
  padding:22px 14px 40px; font-family:'Balsamiq Sans',-apple-system,BlinkMacSystemFont,sans-serif; color:var(--ink);
}
.themebtn{position:absolute;top:13px;right:15px;width:36px;height:36px;z-index:5;
  display:grid;place-items:center;cursor:pointer;padding:0;border-radius:50%;
  border:2px solid var(--hair);background:var(--card);color:var(--soft);transition:.15s}
.themebtn:hover{color:var(--ink);border-color:var(--soft);transform:rotate(-12deg)}
.themebtn svg{width:19px;height:19px}
.app{
  position:relative;
  width:900px; max-width:100%; background:var(--paper); border-radius:26px;
  padding:26px 30px 30px; box-shadow:0 20px 54px var(--shadow);
  display:flex; flex-direction:column; gap:16px;
}
b,strong,h1,.bold{font-family:'Balsamiq Sans',sans-serif;font-weight:700}

/* ── строка входа ── */
.authbar{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--ink);
         flex-wrap:wrap;background:var(--auth);border:2px solid var(--sun2);border-radius:18px;
         padding:9px 48px 9px 14px;margin-bottom:2px}
.authbar.in{background:var(--authin);border-color:var(--authin-br);font-size:13px;padding:7px 46px 7px 13px}
.authbar button{font-family:'Balsamiq Sans',Balsamiq,sans-serif;font-size:14px;font-weight:700;cursor:pointer;
                border:2px solid var(--btn-br);border-radius:16px;padding:6px 15px;
                background:var(--btn);color:var(--btn-fg)}
.authbar button:hover{transform:translateY(-1px)}
.authbar.in button{background:var(--card);border-color:var(--hair);color:var(--ink);
                   font-weight:400;font-size:12.5px;padding:4px 12px}
.authbar.in button:hover{border-color:var(--soft);background:var(--hover)}
.authbar .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.authbar .dot.off{background:var(--hair)}
.authbar input{width:210px;padding:6px 11px;font-size:13px;border-radius:14px;
                border:2px solid var(--hair);background:var(--card);color:var(--ink)}
.authbar .msg{color:var(--ok)}
.authbar{flex-wrap:wrap}
.authbar #mail,.authbar #code{font-size:16px}
.authbar #code{width:150px;text-align:center;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.authbar #code::placeholder{letter-spacing:normal}
.authbar .err{color:#e63946;flex-basis:100%;text-align:center}
.authbar .hint{color:var(--soft);font-size:12.5px;flex-basis:100%;text-align:center}
.authbar .hint u{cursor:pointer}

/* ── шапка ── */
.top{display:flex;flex-direction:column;align-items:center;gap:3px}
.title{display:flex;align-items:center;gap:14px}
.title svg{width:34px;height:34px;flex:none}
h1{font-size:44px;line-height:1.05;letter-spacing:.5px}
.count{font-size:21px;color:var(--soft);margin-top:1px}
.count em{font-style:normal;color:var(--ink);font-family:'Balsamiq Sans'}
.datebar{display:flex;align-items:center;gap:14px;margin-top:5px}
.datebar b{font-size:19px}
.arw{width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--soft);
     font-size:23px;border-radius:50%;user-select:none;line-height:1}
.arw:hover{background:var(--hover);color:var(--ink)}
.arw.off{opacity:.22;pointer-events:none}
.today svg{width:19px;height:19px}
.today:hover{background:var(--sun);color:var(--btn-fg)}
.today{margin-left:-4px}

/* ── шкала прогресса ── */
.gauge{display:flex;align-items:center;gap:13px}
.gauge .bar{flex:1;height:11px;border-radius:8px;background:var(--track)}
.gauge .bar i{display:block;height:100%;border-radius:8px;width:0;
  transition:width .4s ease,background .4s ease}
.gauge b{font-size:16px;white-space:nowrap}
.nowins{color:var(--soft);font-size:15px;padding:2px 0 6px}

/* ── поле звёзд ── */
.field{padding:6px 0 2px}
.dayline{display:flex;align-items:center;gap:11px;margin:14px 0 10px}
.dayline span{font-size:14px;color:var(--soft);white-space:nowrap}
.dayline i{flex:1;height:3px;background:var(--hair);border-radius:2px}
.dayline b{font-size:16px}
.stars{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 12px;
       grid-auto-rows:146px;justify-items:center;align-items:start}
.slot{width:100%;max-width:130px;height:146px;display:flex;flex-direction:column;
      align-items:center;gap:6px;position:relative}
.slot svg{width:88px;height:88px;overflow:visible}
.slot.super svg{width:104px;height:104px;margin:-8px 0}
.slot.done{cursor:pointer}
.slot.done:hover svg{transform:scale(1.07) rotate(-3deg);transition:.16s}
.slot.pop svg{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.cap{
  font-size:13.5px;line-height:1.25;text-align:center;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  height:36px;width:100%;
}
.slot.done:hover .cap{
  position:absolute;top:92px;left:-14px;right:-14px;z-index:9;
  -webkit-line-clamp:unset;height:auto;background:var(--card);
  border:2px solid var(--hair);border-radius:12px;padding:8px 10px;
  box-shadow:0 8px 20px var(--shadow);
}
.empty svg{opacity:.85}

/* ── категории ── */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.cat{
  display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
  border:2.5px solid var(--hair);border-radius:26px;padding:11px 6px;font-size:15.5px;
  background:var(--card);transition:.14s;
}
.cat svg{width:21px;height:21px;flex:none}
.cat:hover{transform:translateY(-1px)}
.cat.on{background:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.07)}

/* ── кнопки ── */
.btns{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:4px}
.row2{display:contents}
.big{
  width:100%;border:3px solid var(--btn-br);border-radius:30px;cursor:pointer;font-family:'Balsamiq Sans';
  background:var(--btn);color:var(--btn-fg);font-size:26px;
  padding:15px;display:flex;align-items:center;justify-content:center;gap:13px;
  box-shadow:0 5px 0 rgba(0,0,0,.16);transition:.12s;
}
.big:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(0,0,0,.16)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.mid{
  width:74%;border:2.5px solid var(--sun2);border-radius:26px;cursor:pointer;font-family:'Balsamiq Sans';
  background:var(--mid);color:var(--ink);font-size:19px;padding:11px;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:.12s;
}
.mid:hover{background:var(--mid-hov)}
.small{
  border:2.5px solid var(--hair);border-radius:24px;cursor:pointer;font-family:'Balsamiq Sans';
  background:var(--card);color:var(--ink);font-size:17px;padding:9px 26px;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:.12s;
}
.small:hover{border-color:var(--soft)}
.big svg,.mid svg,.small svg{width:26px;height:26px;flex:none}
.mid svg{width:24px;height:24px}
.small svg{width:20px;height:20px}

/* ── пара кнопок и привычки ── */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.pair .big{font-size:22px;padding:14px 8px;gap:10px}
.btns .mid{width:100%;flex:none}
.mid.ins{border-color:var(--ins-br);background:var(--ins-bg)}
.mid.ins:hover{background:var(--ins-bg);filter:brightness(1.05)}
.supertog{display:flex;align-items:center;gap:10px;border:2.5px dashed var(--sun2);border-radius:18px;padding:10px 14px;cursor:pointer;font-size:16px;user-select:none}
.supertog span{flex:1}
.supertog small{color:var(--soft);font-size:12.5px}
.sw{width:44px;height:26px;border-radius:13px;background:var(--hair);position:relative;transition:.15s;flex:none}
.sw:after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.supertog.on{border-style:solid;background:#ffd93d1f}
.supertog.on .sw{background:var(--sun2)}
.supertog.on .sw:after{left:21px}
.ins-g{background:var(--card);border:2px solid var(--hair);border-radius:16px;padding:0 14px}
.ins-g>summary{display:flex;align-items:center;gap:8px;cursor:pointer;padding:11px 0;list-style:none;font-size:16px}
.ins-g>summary::-webkit-details-marker,.ins-more>summary::-webkit-details-marker{display:none}
.ins-g>summary span{color:var(--soft);font-size:14px}
.ins-g>summary:after{content:'▾';margin-left:auto;color:var(--soft);transition:transform .15s}
.ins-g:not([open])>summary:after{transform:rotate(-90deg)}
.ins-list{display:flex;flex-direction:column;gap:8px;padding:0 0 12px}
.ins-row{border-left:3px solid var(--ins-br);padding:2px 0 2px 10px;font-size:15px;line-height:1.35}
.ins-row small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.ins-more>summary{cursor:pointer;color:var(--soft);font-size:13.5px;list-style:none;padding:2px 0 2px 13px}
.ins-more[open]>summary{display:none}
.ins-more .ins-row+.ins-row,.ins-more summary+.ins-row{margin-top:8px}
.calarw svg{width:19px;height:19px}
#title{cursor:pointer}
.hs-hint{font-size:13px;color:var(--soft);text-align:center;margin:-3px 0 -4px}
.hs-hint.err{color:var(--del-fg);font-weight:700}
.hsheet{display:none;flex-direction:column;gap:8px}
.hsheet.on{display:flex}
.hs-title{font-weight:700;font-size:20px;text-align:center}
.hrow{display:flex;align-items:center;gap:12px;background:var(--card);border:2.5px solid var(--hair);
  border-radius:18px;padding:7px 14px;cursor:pointer;transition:border-color .12s}
.hrow:hover{border-color:var(--soft)}
.hrow svg{width:46px;height:46px;flex:none;overflow:visible}
.hrow .nm{flex:1;font-size:17px;line-height:1.2;min-width:0}
.hrow .nm small{display:block;font-size:12.5px;color:var(--soft)}
.hrow .st{font-size:14px;color:var(--soft);white-space:nowrap}
.hrow.done{opacity:.55;cursor:default}
.hrow.done:hover{border-color:var(--hair)}
.hrow.done .st{color:var(--ink)}
.hs-add{border:2.5px dashed var(--hair);border-radius:18px;padding:11px;text-align:center;color:var(--soft);
  cursor:pointer;font-size:15px}
.hs-add:hover{border-color:var(--soft);color:var(--ink)}
.hs-empty{font-size:15px;color:var(--soft);text-align:center;padding:8px 10px;line-height:1.4}
.hs-foot{display:flex;justify-content:center;gap:22px;font-size:14px;color:var(--soft)}
.hs-foot span{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hs-foot span:hover{color:var(--ink)}

/* ── нижние ссылки и экраны «Путь победителя» / «Счётчик побед» ── */
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.links button{display:flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--hair);border-radius:22px;
  background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:10px;cursor:pointer;transition:border-color .12s}
.links button:hover{border-color:var(--soft)}
.links svg{width:19px;height:19px;flex:none}
.screen{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:22px 14px 40px}
.screen-in{max-width:900px;margin:0 auto;background:var(--paper);border-radius:26px;padding:20px 26px 30px;
  box-shadow:0 20px 54px var(--shadow);display:flex;flex-direction:column;gap:18px}
.screen-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.screen-top h2{font-size:28px;text-align:center}
.screen-top button{font:inherit;font-size:15px;border:2px solid var(--hair);background:var(--card);color:var(--ink);
  border-radius:18px;padding:6px 14px;cursor:pointer}
.screen-top span{width:92px}
.scrbody{display:flex;flex-direction:column;gap:16px}
.way-demo{font:inherit;font-size:16px;font-weight:700;cursor:pointer;border:2.5px solid var(--btn-br);border-radius:20px;
  background:var(--btn);color:var(--btn-fg);padding:12px 16px}
.authbar button.ghost{background:var(--card);border-color:var(--hair);color:var(--ink);font-weight:400}
.authbar.demo{background:var(--authin);border-color:var(--authin-br)}
.way{background:var(--card);border:2px solid var(--hair);border-radius:20px;padding:16px 18px}
.way h3{font-size:19px;margin-bottom:6px}
.way p{font-size:15.5px;line-height:1.5;max-width:64ch}
.lvrow1{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.lvrow1 svg{width:58px;height:58px;overflow:visible}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:2px solid;border-radius:14px;padding:4px 11px;font-size:13.5px;font-weight:700}
.st-sec{display:flex;flex-direction:column;gap:10px}
.st-sec h3{font-size:19px}
.st-sec h3 small{font-size:13px;color:var(--soft);font-weight:400;margin-left:6px}
.muted{color:var(--soft);font-size:14.5px}
.per{display:inline-flex;background:var(--track);border-radius:18px;padding:3px;gap:3px;align-self:flex-start}
.per span{padding:6px 14px;border-radius:15px;font-size:14px;color:var(--soft);cursor:pointer}
.per span.on{background:var(--btn);color:var(--btn-fg);font-weight:700}
.cmp{display:flex;align-items:baseline;gap:10px 14px;flex-wrap:wrap}
.cmp .big-n{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cmp .lbl{color:var(--soft);font-size:15px}
.cmp .up{color:var(--ok);font-size:22px} .cmp .down{color:var(--del-fg);font-size:22px}
.sbar{display:grid;grid-template-columns:132px 1fr 44px;align-items:center;gap:10px;font-size:15px}
.sname{display:flex;align-items:center;gap:7px;white-space:nowrap}
.sname svg{width:17px;height:17px;flex:none}
.strack{height:12px;border-radius:7px;background:var(--track);overflow:hidden}
.strack i{display:block;height:100%;border-radius:7px}
.sbar b{text-align:right;font-variant-numeric:tabular-nums}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
.hcard{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--hair);border-radius:18px;padding:12px 14px}
.hcard>svg{width:64px;height:64px;flex:none;overflow:visible}
.hinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.hinfo b{font-size:16px}
.hinfo small{color:var(--soft);font-size:12.5px}
.hnums{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.hnums span{display:flex;flex-direction:column;line-height:1.2}
.hnums em{font-style:normal;font-weight:700;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.hnext{font-size:13.5px;font-weight:700;color:var(--ok)}
.ysum{font-size:14.5px;color:var(--soft)}
.ysum b{color:var(--ink)}
.year{display:flex;gap:6px}
.ywd{display:grid;grid-template-rows:16px repeat(7,12px);gap:3px;font-size:10px;color:var(--soft);line-height:12px}
.year-scroll{overflow-x:auto;padding-bottom:4px;min-width:0}
.ymonths{position:relative;height:16px;font-size:10.5px;color:var(--soft)}
.ymonths span{position:absolute;top:0;white-space:nowrap}
.ygrid{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px}
.ygrid i{width:12px;height:12px;border-radius:3px}
.y0{background:var(--yr0)}.y1{background:var(--yr1)}.y2{background:var(--yr2)}.y3{background:var(--yr3)}.y4{background:var(--yr4)}
.ylegend{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--soft)}
.ylegend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:8px;max-height:430px;overflow-y:auto;align-content:start}
.feed-row{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--hair);border-radius:16px;padding:8px 12px}
.feed-row svg{width:42px;height:42px;flex:none;overflow:visible}
.feed-row b{display:block;font-size:15px;line-height:1.25}
.feed-row small{font-size:12.5px;color:var(--soft)}

/* ── боковые поля на компьютере: звёзды «Вспомнить суперпобеду» и «Вспомнить инсайт» ── */
.drift{position:fixed;left:0;top:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:4px;
  will-change:transform;opacity:.2;filter:grayscale(1);transition:opacity .35s,filter .35s}
.drift[hidden],.dcard[hidden]{display:none}
.drift.lit{opacity:1;filter:none}
.drift-star{background:none;border:0;padding:0;cursor:pointer;width:64px;height:64px;animation:dbob 6s ease-in-out infinite;transition:transform .25s}
.drift.insight .drift-star{animation-delay:-3s}
.drift.lit .drift-star{transform:scale(1.15);animation-play-state:paused}
.drift-star svg{width:64px;height:64px;overflow:visible;display:block}
.drift-star:focus-visible{outline:3px solid var(--sun2);outline-offset:6px;border-radius:50%}
.drift-lbl{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;opacity:0;transform:translateY(-4px);transition:.25s;
  pointer-events:none;background:var(--paper);border:2px solid var(--hair);border-radius:12px;padding:2px 9px}
.drift.lit .drift-lbl{opacity:1;transform:none}
@keyframes dbob{0%,100%{translate:0 0}50%{translate:0 -6px}}
.dcard{position:fixed;z-index:41;background:var(--paper);border:2px solid var(--hair);border-radius:18px;padding:13px 16px 12px;
  box-shadow:0 14px 34px var(--shadow);color:var(--ink);animation:dpop .2s ease-out}
.dcard.super{border-color:var(--sun2)}
.dcard.insight{border-color:var(--ins-br)}
.dkick{font-size:12.5px;font-weight:700;color:var(--soft);padding-right:22px}
.dtext{font-size:16px;line-height:1.4;margin:6px 0 10px}
.dempty{font-size:14px;line-height:1.4;color:var(--soft);margin:6px 0 2px}
.dfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dfoot small{font-size:12px;color:var(--soft)}

@media (prefers-reduced-motion: reduce){.drift-star,.dcard{animation:none}}

html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* ── ввод ── */
.composer{display:none;flex-direction:column;gap:11px}
.composer.on{display:flex}
input{
  width:100%;background:var(--card);border:2.5px solid var(--hair);border-radius:18px;
  padding:15px 18px;font-size:19px;font-family:'Balsamiq Sans';color:var(--ink);outline:none;
}
input:focus{border-color:var(--sun2)}
input::placeholder{color:var(--soft)}
.crow{display:flex;gap:10px}
.crow button{flex:1;padding:12px;border-radius:20px;cursor:pointer;font-family:'Balsamiq Sans';
             font-size:17px;border:2.5px solid var(--btn-br)}
.crow .ok{background:var(--btn);color:var(--btn-fg);border-color:var(--btn-br)}
.crow .no{background:var(--card);border-color:var(--hair);color:var(--soft)}
.crow .del{background:var(--card);border-color:var(--del-br);color:var(--del-fg);flex:0 0 auto;padding:12px 20px}

/* ── календарь ── */
.veil{position:fixed;inset:0;background:var(--veil);display:none;
      align-items:center;justify-content:center;padding:20px;z-index:50}
.veil.on{display:flex}
.modal{background:var(--modal);border-radius:24px;padding:24px;width:420px;max-width:100%;
       box-shadow:0 22px 50px var(--shadow)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mhead b{font-size:22px}
.seg{display:flex;gap:8px;margin-bottom:16px}
.seg span{flex:1;text-align:center;padding:9px 0;border:2.5px solid var(--hair);border-radius:20px;
          font-size:16px;cursor:pointer;background:var(--card)}
.seg span.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn-br)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:12px;color:var(--soft);padding-bottom:4px}
.cal .d{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
        border-radius:12px;cursor:pointer;font-size:15px;border:2px solid transparent;position:relative}
.cal .d:hover{background:var(--hover)}
.cal .d.out{opacity:.25;pointer-events:none}
.cal .d.today{border-color:var(--hair)}
.cal .d.sel{background:var(--btn);color:var(--btn-fg);border-color:var(--btn-br)}
.cal .d i{font-style:normal;font-size:10px;color:var(--soft);margin-top:1px}
.cal .d.sel i{color:var(--btn-fg)}
.mclose{width:100%;margin-top:16px;padding:11px;border:2.5px solid var(--hair);border-radius:22px;
        background:var(--card);color:var(--ink);font-family:'Balsamiq Sans';font-size:17px;cursor:pointer}

<script>
const CATS = [
  {id:'здоровье', name:'Здоровье', c:'#e63946', f:'#ffb3ae', dc:'#ff6f79', df:'#63212a', ic:'<path d="M12 20s-7-4.6-7-9.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 7 3.5C19 15.4 12 20 12 20z"/>'},

// ── «Посмотреть пример»: год тестовых данных только в памяти — ничего не сохраняется и не уходит в облако ──
function makeDemo(){
  let n = 7; const rnd = () => (n = (n * 16807) % 2147483647) / 2147483647;
  const ids = ['здоровье','деньги','работа','семья','обучение','развитие','энергия','режим','другое'], wt = [5,2,6,2,3,3,2,2,1];
  const pick = () => { let t = rnd() * 26, i = 0; while ((t -= wt[i]) > 0) i++; return ids[i]; };
  const TX = {'здоровье':['Тренировка в зале','Пробежал 7 км','Растяжка 20 минут'],'деньги':['Закрыл счёт клиента','Отложил 10%','Заработал 50 000 ₽'],
    'работа':['Провёл планёрку','Сдал проект','Созвон с партнёром','Разобрал почту'],'семья':['Позвонил отцу','Ужин с семьёй'],
    'обучение':['Прочитал 30 страниц','Урок английского'],'развитие':['Медитация 10 минут','Записал идеи в дневник'],
    'энергия':['Холодный душ','Прогулка без телефона'],'режим':['Лёг до 23:00','Встал в 7:00'],'другое':['Разобрал гараж']};
  const SUP = ['Запустил свой проект','Подписали контракт','Выступил на конференции','Закрыл квартал в плюс','Пробежал полумарафон'];
  const today = startOfDay(new Date()), day = i => { const d = new Date(today); d.setDate(d.getDate() - i); return d; };
  const W = [];
  for (let i = 330; i >= 0; i--) {
    const d = day(i), wd = (d.getDay() + 6) % 7;
    if (rnd() < 0.14) continue;
    const k = Math.floor(rnd() * 4) + (wd === 1 ? 4 : wd >= 5 ? 0 : 2) + (i < 40 ? 2 : 0);
    for (let j = 0; j < k; j++) { const s = pick(), t = new Date(d); t.setHours(8 + j);
      W.push({id:'demo'+i+'_'+j, t:TX[s][j % TX[s].length], s, d:t.toISOString(), synced:true}); }
    if (rnd() < 0.045) { const t = new Date(d); t.setHours(21);
      W.push({id:'demos'+i, t:SUP[Math.floor(rnd() * SUP.length)], s:pick(), d:t.toISOString(), super:true, synced:true}); }
  }
  const IT = {'жизнь':['Отдых — часть работы, а не награда за неё','Близким важнее внимание, чем подарки'],
    'бизнес':['Клиенту важнее скорость, чем цена','Делегировать то, что раздражает','Сначала продажа, потом продукт'],

// ── звезда с настоящим скруглением вершин
function starPath(R, r, roundOut, roundIn){
  const cx = 50, cy = 51, n = 5;
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const rad = i % 2 ? r : R;
    const a = -Math.PI / 2 + i * Math.PI / n;
    pts.push([cx + rad * Math.cos(a), cy + rad * Math.sin(a)]);
  }
  const seg = (from, to, dist) => {
    const dx = to[0] - from[0], dy = to[1] - from[1];
    const len = Math.hypot(dx, dy);
    const t = Math.min(dist, len * 0.48) / len;
    return [from[0] + dx * t, from[1] + dy * t];
  };
  let d = '';
  for (let i = 0; i < pts.length; i++) {
    const prev = pts[(i - 1 + pts.length) % pts.length];
    const cur  = pts[i];
    const next = pts[(i + 1) % pts.length];
    const rr = i % 2 ? roundIn : roundOut;
    const a = seg(cur, prev, rr);
    const b = seg(cur, next, rr);
    d += (i === 0 ? 'M' + a[0].toFixed(2) + ' ' + a[1].toFixed(2)
                  : 'L' + a[0].toFixed(2) + ' ' + a[1].toFixed(2));
    d += 'Q' + cur[0].toFixed(2) + ' ' + cur[1].toFixed(2)
       + ' ' + b[0].toFixed(2) + ' ' + b[1].toFixed(2);
  }
  return d + 'Z';
}

function streaks(){
  if (streakCache) return streakCache;
  const out = {}, today = startOfDay(new Date());
  for (const h of habits) {
    const marks = wins.filter(w => w.h === h.id), at = {};
    let c = 0;

      const d = startOfDay(new Date(Math.min(...marks.map(w => new Date(w.d).getTime()))));
      for (; d <= today; d.setDate(d.getDate() + 1)) {

    + card('Шкала дня', 'Цель не рекорд, а не опускаться ниже «уже неплохо».', `<div class="pills">${pills}</div>`)
    + card('Привычка растёт, пока ты её держишь',
      'Каждый день подряд прибавляет единицу к серии. 7 дней — звезда проснулась и улыбается. 21 — смеётся. 90 — становится бойцом. 180 — боец в золоте.',
      `<div class="lvrow1">${lv}</div>`)
    + card('Пропуск — не конец',
      'Пропустил день — серия откатывается на уровень ниже, а не в ноль. Месяц работы из-за одного срыва не сгорает. Правило простое: не пропускай два дня подряд.')
    + card('Как не бросить',
      'Записывай победу сразу, пока помнишь. Вечером открой привычки и отметь, что сделал. Не придумывай победы ради шкалы: звезда должна что-то значить.');
}

function periodRanges(){
  const today = startOfDay(new Date()), end = addDays(today, 1), y = today.getFullYear();
  if (statsPer === 'week')
    return {a: addDays(today, -6), b: end, pa: addDays(today, -13), pb: addDays(today, -6), cur: 'за 7 дней', prev: 'к прошлым 7 дням'};
  if (statsPer === 'year')
    return {a: new Date(y, 0, 1), b: end, pa: new Date(y - 1, 0, 1),
            pb: addDays(new Date(y - 1, today.getMonth(), today.getDate()), 1), cur: 'с начала года', prev: `к тому же периоду ${y - 1} года`};
  const pa = new Date(y, today.getMonth() - 1, 1);
  const lastPrev = new Date(y, today.getMonth(), 0).getDate();
  return {a: new Date(y, today.getMonth(), 1), b: end, pa,
          pb: addDays(new Date(pa.getFullYear(), pa.getMonth(), Math.min(today.getDate(), lastPrev)), 1),
          cur: 'с 1 ' + MONTHS_GEN[today.getMonth()], prev: 'к тем же дням ' + MONTHS_GEN[pa.getMonth()]};
}
function habitStats(h){
  const today = startOfDay(new Date()).getTime();
  const days = [...new Set(wins.filter(w => w.h === h.id).map(w => startOfDay(new Date(w.d)).getTime()))].sort((a, b) => a - b);
  const created = h.created ? startOfDay(new Date(h.created)).getTime() : today;
  const start = Math.min(created, days.length ? days[0] : created);
  const total = Math.round((today - start) / 864e5) + 1;
  let best = 0, run = 0, prev = null;
  for (const t of days) { run = prev !== null && Math.round((t - prev) / 864e5) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = t; }
  return {total, done: days.length, pct: Math.round(days.length / total * 100), best, now: streakNow(h.id), since: new Date(start)};
}
function yearHTML(){
  const today = startOfDay(new Date());
  let start = addDays(today, -364);
  while ((start.getDay() + 6) % 7) start = addDays(start, -1);
  const cnt = {};
  wins.forEach(w => { const k = dayKey(w.d); cnt[k] = (cnt[k] || 0) + 1; });
  let cells = '', months = '', col = 0, lastM = -1, total = 0, active = 0, best = null;
  for (let d = new Date(start); d <= today; d = addDays(d, 1)) {
    if ((d.getDay() + 6) % 7 === 0) {
      if (d.getMonth() !== lastM) { months += `<span style="left:${col * 15}px">${MONTHS_SHORT[d.getMonth()]}</span>`; lastM = d.getMonth(); }
      col++;
    }
    const n = cnt[dayKey(d)] || 0, lv = n >= 8 ? 4 : n >= 5 ? 3 : n >= 3 ? 2 : n >= 1 ? 1 : 0;
    if (d > addDays(today, -365)) { total += n; if (n) active++; if (!best || n > best.n) best = {n, d: new Date(d)}; }
    cells += `<i class="y${lv}" title="${d.getDate()} ${MONTHS_GEN[d.getMonth()]}: ${n} ${winsWord(n)}"></i>`;
  }
  const wd = ['', 'пн', '', 'ср', '', 'пт', '', ''].map(x => `<span>${x}</span>`).join('');
  return `<div class="ysum">За год <b>${total}</b> ${winsWord(total)} · дней с победами <b>${active}</b> из 365
      ${best && best.n ? ` · рекорд — <b>${best.n}</b> ${best.d.getDate()} ${MONTHS_GEN[best.d.getMonth()]}` : ''}</div>
    <div class="year"><div class="ywd">${wd}</div>
      <div class="year-scroll"><div class="ymonths" style="width:${col * 15}px">${months}</div><div class="ygrid">${cells}</div></div></div>
    <div class="ylegend">меньше <i class="y0"></i><i class="y1"></i><i class="y2"></i><i class="y3"></i><i class="y4"></i> больше
      <span style="margin-left:8px">— те же пороги, что у шкалы дня</span></div>`;
}
function insightsHTML(cur, label){
  const n = cur.filter(w => w.ins).length, all = wins.filter(w => w.ins).length;
  const row = w => { const d = new Date(w.d);
    return `<div class="ins-row">${esc(w.t)}<small>${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}</small></div>`; };
  const body = insightGroups(wins).filter(g => g.items.length).map((g, i) =>
    `<details class="ins-g"${i ? '' : ' open'}><summary><b>${g.name}</b><span>${g.items.length}</span></summary>
      <div class="ins-list">${g.items.slice(0, 3).map(row).join('')}
        ${g.items.length > 3 ? `<details class="ins-more"><summary>ещё ${g.items.length - 3}</summary>${g.items.slice(3).map(row).join('')}</details>` : ''}
      </div></details>`).join('')
    || '<p class="muted">Инсайтов пока нет — запиши первый кнопкой «Добавить инсайт».</p>';
  return `<section class="st-sec"><h3>Инсайты <small>${n} ${label} · всего ${all}</small></h3>${body}</section>`;
}
function statsHTML(){
  const r = periodRanges(), cur = winsIn(r.a, r.b), prev = winsIn(r.pa, r.pb);
  const diff = prev.length ? Math.round((cur.length - prev.length) / prev.length * 100) : null;
  const trend = diff === null ? '<span class="lbl">раньше побед не было — сравнивать не с чем</span>'
    : `<b class="${diff >= 0 ? 'up' : 'down'}">${diff > 0 ? '+' : diff < 0 ? '−' : ''}${Math.abs(diff)}%</b>
       <span class="lbl">${r.prev} (${prev.length})</span>`;
  const per = [['week','Неделя'], ['month','Месяц'], ['year','Год']]
    .map(([k, t]) => `<span data-per="${k}" class="${statsPer === k ? 'on' : ''}">${t}</span>`).join('');

  const by = {};
  cur.forEach(w => { by[w.s] = (by[w.s] || 0) + 1; });
  const rows = CATS.concat([INSIGHT_CAT]).map(c => ({c, n: by[c.id] || 0})).filter(x => x.n).sort((a, b) => b.n - a.n);
  const max = rows.length ? rows[0].n : 1;
  const bars = rows.map(x => { const t = tint(x.c);
    return `<div class="sbar"><span class="sname">${catIcon(x.c, t.c)}${x.c.name}</span>
      <div class="strack"><i style="width:${Math.max(3, x.n / max * 100)}%;background:${t.c}"></i></div><b>${x.n}</b></div>`; }).join('')
    || '<p class="muted">За этот период побед пока нет.</p>';

  const hc = habits.filter(h => !h.archived).map(h => {
    const s = habitStats(h), c = cat(h.s), L = lvlOf(s.now), left = L >= 1 && L <= 4 ? LV_START[L] - s.now : 0;
    const next = s.now === 0 ? 'отметь сегодня — звезда проснётся'
      : L >= 5 ? 'высший уровень — боец в золоте' : `${NEXT_LV[L]} — ${left} ${dayWord(left)}`;
    return `<div class="hcard">${habitStar(Math.max(1, s.now), c, s.now === 0)}
      <div class="hinfo"><b>${esc(h.n)}</b><small>${c.name} · с ${s.since.getDate()} ${MONTHS_GEN[s.since.getMonth()]}</small>
        <div class="hnums"><span><em>${s.now}</em>серия</span><span><em>${s.best}</em>рекорд подряд</span>
          <span><em>${s.pct}%</em>${s.done} из ${s.total} ${dayWord(s.total)}</span></div>
        <div class="hnext">${next}</div></div></div>`; }).join('')
    || '<p class="muted">Привычек пока нет — заведи первую кнопкой «Добавить привычку».</p>';

  const feed = wins.filter(w => w.super).sort((a, b) => new Date(b.d) - new Date(a.d)).map(w => {
    const d = new Date(w.d), c = cat(w.s);
    return `<div class="feed-row">${star(SUPER_FILL, SUPER, {super:true})}<div><b>${esc(w.t)}</b>
      <small>${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()} · <span style="color:${tint(c).c}">${c.name}</span></small></div></div>`; }).join('')
    || '<p class="muted">Суперпобед пока нет. Первая появится здесь.</p>';

  return `<section class="st-sec"><div class="per">${per}</div>
      <div class="cmp"><span class="big-n">${cur.length}</span><span class="lbl">${winsWord(cur.length)} ${r.cur}</span>${trend}</div></section>
    <section class="st-sec"><h3>Победы по сферам <small>${r.cur}</small></h3>${bars}</section>
    <section class="st-sec"><h3>Привычки</h3><div class="hcards">${hc}</div></section>
    ${insightsHTML(cur, r.cur)}
    <section class="st-sec"><h3>Год клетками</h3>${yearHTML()}</section>
    <section class="st-sec"><h3>Лента суперпобед</h3><div class="feed">${feed}</div></section>`;
}

// ── ступени шкалы: пороги растянуты под длину периода ──
const GRADES = [
  {label:'Есть куда расти',  c:'#a8a69a', t:'#8d8d86', dc:'#5c5a50', dt:'#918f83'},
  {label:'Уже неплохо',      c:'#eab308', t:'#c99700', dc:'#e0b02a', dt:'#e8bb3c'},
  {label:'Так держать',      c:'#22b455', t:'#22b455', dc:'#2ea85c', dt:'#45c97e'},
  {label:'Вот это уровень!', c:'#2fd44f', t:'#12a03d', dc:'#3ad45e', dt:'#56e07a'}
];
const STEPS = [[3,5,8], [6,12,21], [14,28,49]];

function grade(n, p){
  const s = STEPS[p];
  const i = n>=s[2] ? 3 : n>=s[1] ? 2 : n>=s[0] ? 1 : 0;
  const g = GRADES[i], d = isDark();
  return {label:g.label, c: d ? g.dc : g.c, t: d ? g.dt : g.t,
          pct: Math.min(100, Math.round(n / s[2] * 100))};
}
function fillGauge(id, show, n, p){
  const el = document.getElementById(id);
  el.style.display = show ? '' : 'none';
  if (!show) return;
  const g = grade(n, p), bar = el.querySelector('i'), lab = el.querySelector('b');
  bar.style.width = g.pct + '%';
  bar.style.background = g.c;
  lab.textContent = g.label;
  lab.style.color = g.t;
}

function render(){
  streakCache = null;
  if (period !== 0) hsOpen = false;
  const list = visible().sort((a,b)=>new Date(a.d)-new Date(b.d));
  const n = list.length;

  document.getElementById('count').innerHTML =
    (period===0 ? (isToday() ? 'Побед сегодня: ' : 'Побед за день: ')
                : 'Побед за ' + (period===2 ? 'неделю' : '3 дня') + ': ') + '<em>'+n+'</em>';
  document.getElementById('title').textContent = titleText();
  document.getElementById('next').className = 'arw' + (isToday() && period===0 ? ' off' : '');
  document.getElementById('todaybtn').style.display = isToday() ? 'none' : '';

  fillGauge('gday', period === 0, n, period);

  const field = document.getElementById('field');
  if (period === 0) {
    // всего ячеек — всегда кратно 5, минимум 20, чтобы ряды были полными
    const total = Math.max(EMPTY_SLOTS, Math.ceil((n + 1) / 5) * 5);
    field.innerHTML = '<div class="stars">' + list.map(slot).join('')
      + Array(Math.max(0, total - n)).fill(emptySlot()).join('') + '</div>';
  } else {
    const byDay = {};
    list.forEach(w=>{ const k=startOfDay(new Date(w.d)).getTime(); (byDay[k]=byDay[k]||[]).push(w); });
    let h='';
    for (let i=0;i<PERIODS[period].days;i++){
      const d=new Date(anchor); d.setDate(d.getDate()-i);
      const items = byDay[startOfDay(d).getTime()] || [];
      const dg = grade(items.length, 0);
      h += `<div class="dayline"><span>${d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric'})}</span>
            <i style="background:linear-gradient(90deg,${dg.c} ${dg.pct}%,var(--hair) ${dg.pct}%)"></i>
            <b>${items.length}</b></div>`
         + (items.length ? '<div class="stars">' + items.map(slot).join('') + '</div>'
                         : '<div class="nowins">побед не было</div>');
    }
    field.innerHTML = h;
  }

  document.getElementById('cats').innerHTML = insightMode ? secChips() : CATS.map(c=>{
    const on = picked===c.id, cl = tint(c).c;
    return `<div class="cat${on?' on':''}" data-c="${c.id}"
      style="border-color:${on?cl:'var(--hair)'};${on?'background:'+cl+(isDark()?'26':'14'):''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="${cl}" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">${c.ic}</svg>
      ${c.name}</div>`;
  }).join('');

  updateComposerExtras();
  const solo = period===0;
  const busy = composerOpen() || hsOpen;
  document.getElementById('pair').style.display     = solo && !busy ? '' : 'none';
  document.getElementById('insightbtn').style.display = solo && !busy ? '' : 'none';
  renderHabitSheet();
  if (scr) renderScreen();
  if (typeof paintAuth === 'function') paintAuth();
  if (typeof driftRefresh === 'function') driftRefresh();
  justAdded = null;
}

function titleText(){
  if (period===0) return anchor.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const a=rangeStart(), b=anchor, same=a.getMonth()===b.getMonth();
  return a.toLocaleDateString('ru-RU', same?{day:'numeric'}:{day:'numeric',month:'long'})
       + ' — ' + b.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
function composerOpen(){ return document.getElementById('composer').classList.contains('on'); }

function secChips(){
  const col = isDark() ? INSIGHT.dc : INSIGHT.c;
  return INSIGHT_SECS.map(x => { const on = pickedSec === x.id;
    return `<div class="cat${on ? ' on' : ''}" data-sec="${x.id}"
      style="border-color:${on ? col : 'var(--hair)'};${on ? 'background:' + col + (isDark() ? '26' : '14') : ''}">
      <svg viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round">${INSIGHT_CAT.ic}</svg>
      ${x.name}</div>`; }).join('');
}
function updateComposerExtras(){
  document.getElementById('chint').textContent = insightMode ? 'в какой раздел?' : 'в какую сферу?';
  const tog = document.getElementById('supertog'), k = dayKey(anchor);
  tog.style.display = insightMode ? 'none' : '';
  tog.classList.toggle('on', superMode);
  const other = wins.some((w, i) => w.super && i !== editing && dayKey(w.d) === k);
  document.getElementById('superhint').textContent = !superMode && other ? 'сегодня уже есть' : '';
  document.getElementById('draft').placeholder = insightMode ? 'Что понял? Запиши инсайт'
    : superMode ? 'Запиши суперпобеду дня' : 'Запиши свою победу';
}
function openComposer(text, tagId, isSuper, isInsight, sec){
  document.getElementById('composer').classList.add('on');
  document.getElementById('remove').style.display = editing!==null ? '' : 'none';
  superMode = !!isSuper; insightMode = !!isInsight;
  if (sec) pickedSec = sec;
  if (tagId && !insightMode) picked = tagId;
  render();
  const d=document.getElementById('draft'); d.value=text||''; d.focus(); d.select();
}
function closeComposer(){
  editing=null; superMode=false; insightMode=false;
  document.getElementById('composer').classList.remove('on');
  document.getElementById('draft').value='';
  render();
}
function commit(){
  const t=document.getElementById('draft').value.trim();
  if(!t){ closeComposer(); return; }
  if(editing!==null){
    const w = wins[editing];
    w.t=t; w.synced=false;
    if (insightMode) { w.sec=pickedSec; }
    else { w.s=picked; if (superMode) w.super=true; else delete w.super; }
    if (typeof pushWin==='function') pushWin(wins[editing]);
  }
  else {
    // пишем в выбранный день, время берём текущее
    const now = new Date();
    const when = new Date(anchor);
    when.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
    const rec={id:(typeof uid==='function'?uid():String(Date.now())),
               t, s:insightMode?'инсайт':picked, d:when.toISOString(), synced:false};
    if(insightMode){ rec.ins=true; rec.sec=pickedSec; }
    else if(superMode) rec.super=true;
    wins.push(rec); justAdded=rec.d;
    if (typeof pushWin==='function') pushWin(rec);
    period=0;                      // остаёмся на выбранной дате
  }
  save(); closeComposer();
}

// ── календарь
function renderCal(){
  const first=new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  document.getElementById('mtitle').textContent =
    calMonth.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  document.getElementById('seg').innerHTML = PERIODS
    .map((p,i)=>`<span class="${i===period?'on':''}" data-p="${i}">${p.id}</span>`).join('');
  let h = ['пн','вт','ср','чт','пт','сб','вс'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const out = d.getMonth()!==calMonth.getMonth() || d>new Date();
    const n = dayCount(d);
    const cls = ['d', out?'out':'',
      startOfDay(d).getTime()===startOfDay(new Date()).getTime()?'today':'',
      startOfDay(d).getTime()===anchor.getTime()?'sel':''].filter(Boolean).join(' ');
    h += `<div class="${cls}" data-day="${d.toISOString()}">${d.getDate()}${n?`<i>${n}</i>`:''}</div>`;
  }
  document.getElementById('cal').innerHTML = h;
}

document.addEventListener('click', e=>{
  if (e.target.closest('#waybtn')) { openScreen('way'); return; }
  if (e.target.closest('#demobtn2')) { startDemo(); return; }
  if (e.target.closest('#statsbtn')) { openScreen('stats'); return; }
  if (e.target.closest('#scrback')) { closeScreen(); return; }
  const per = e.target.closest('[data-per]');
  if (per) { statsPer = per.dataset.per; renderScreen(); return; }
  if (e.target.closest('#habitbtn')) { hsOpen = true; hsMode = 'list'; hsForm = null; render(); return; }
  const hm = e.target.closest('[data-hmark]');
  if (hm) { markHabit(hm.dataset.hmark); return; }
  const he = e.target.closest('[data-hedit]');
  if (he) { const h = habits.find(x => x.id === he.dataset.hedit);
    hsForm = {id: h.id, n: h.n, s: h.s}; hsMode = 'form'; render(); focusHabitName(); return; }
  if (e.target.closest('#hsnew')) { hsForm = {id: null, n: '', s: null}; hsMode = 'form'; render(); focusHabitName(); return; }
  if (e.target.closest('#hsedit')) { hsMode = hsMode === 'edit' ? 'list' : 'edit'; render(); return; }
  if (e.target.closest('#hsclose')) { hsOpen = false; render(); return; }
  const hc = e.target.closest('[data-hcat]');
  if (hc) { hsForm.n = document.getElementById('hname').value; hsForm.s = hc.dataset.hcat; hsForm.err = false; render(); focusHabitName(); return; }
  if (e.target.closest('#hsave')) { saveHabitForm(); return; }
  if (e.target.closest('#hback')) { hsMode = 'list'; hsForm = null; render(); return; }
  if (e.target.closest('#hdel')) { archiveHabit(); return; }
  if (e.target.closest('#supertog')) { superMode = !superMode; render(); document.getElementById('draft').focus(); return; }
  const sc = e.target.closest('[data-sec]');
  if (sc) { pickedSec = sc.dataset.sec; render(); document.getElementById('draft').focus(); return; }
  const c=e.target.closest('[data-c]');
  if(c){ picked=c.dataset.c; render(); if(composerOpen()) document.getElementById('draft').focus(); return; }
  const ed=e.target.closest('[data-edit]');
  if(ed){ const i=+ed.dataset.edit;
    if (wins[i] && wins[i].h) { unmarkHabit(i); return; }
    editing=i; openComposer(wins[editing].t, wins[editing].s, wins[editing].super, wins[editing].ins, wins[editing].sec); return; }
  if(e.target.closest('#addbtn')){ editing=null; openComposer('',null,false); return; }
  if(e.target.closest('#insightbtn')){ editing=null; openComposer('',null,false,true); return; }
  if(e.target.id==='save') commit();
  if(e.target.id==='cancel') closeComposer();
  if(e.target.id==='remove' && editing!==null){
    const gone = wins[editing];
    wins.splice(editing,1); save();
    if (typeof deleteWin==='function' && gone && gone.id) deleteWin(gone.id);
    closeComposer(); return;
  }
  if(e.target.closest('#calbtn') || e.target.closest('#title')){ calMonth=new Date(anchor); document.getElementById('veil').classList.add('on'); renderCal(); return; }
  if(e.target.id==='mclose' || e.target.id==='veil'){ document.getElementById('veil').classList.remove('on'); return; }
  if(e.target.closest('#mprev')){ calMonth.setMonth(calMonth.getMonth()-1); renderCal(); return; }
  if(e.target.closest('#mnext')){ calMonth.setMonth(calMonth.getMonth()+1); renderCal(); return; }
  const p=e.target.closest('[data-p]');
  if(p){ period=+p.dataset.p; renderCal(); render(); return; }
  const day=e.target.closest('[data-day]');
  if(day){ anchor=startOfDay(new Date(day.dataset.day)); renderCal(); render(); return; }
});
document.addEventListener('keydown', e=>{
  if (e.key === 'Escape' && scr) { closeScreen(); return; }
  if (e.target.id !== 'hname') return;
  if (e.key === 'Enter') saveHabitForm();
  if (e.key === 'Escape') { hsMode = 'list'; hsForm = null; render(); }
});
document.getElementById('draft').addEventListener('keydown', e=>{
  if(e.key==='Enter') commit();
  if(e.key==='Escape') closeComposer();
});
document.getElementById('prev').onclick=()=>{ anchor.setDate(anchor.getDate()-PERIODS[period].days); render(); };
document.getElementById('next').onclick=()=>{ anchor.setDate(anchor.getDate()+PERIODS[period].days); render(); };
document.getElementById('todaybtn').onclick=()=>{ anchor=startOfDay(new Date()); render(); };

// телефон: экран не приближается щипком — iOS игнорирует запрет в viewport, поэтому гасим жест
['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));

render();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="sync.js"></script>
<script>
function paintAuth(){
  const bar = document.getElementById('authbar');
  if (!bar) return;
  if (demoMode) {
    bar.className = 'authbar demo';
    bar.innerHTML = `<span>Это пример с тестовыми данными за год — здесь ничего не сохраняется</span>
      <button id="demoexit">Выйти из примера</button>`;
    return;
  }
  if (typeof user !== 'undefined' && user) {
    const pending = wins.filter(w => !w.synced).length + habits.filter(h => !h.synced).length;
    bar.className = 'authbar in';
    bar.innerHTML = `<span class="dot"></span>${user.email}
      ${syncing ? '<span>синхронизация…</span>' : (pending ? `<span>ждут отправки: ${pending}</span>` : '<span>всё сохранено</span>')}
      <button id="outbtn">выйти</button>`;
  } else {
    bar.className = 'authbar';
    bar.innerHTML = `<span>⭐ Победы пока только на этом устройстве</span>
      <button id="inbtn">Войти и синхронизировать</button>
      <button id="demobtn" class="ghost">Посмотреть пример</button>`;
  }
}

// ── вход по коду из письма: почта → 6 цифр → внутри. Работает в любом браузере и в приложении на iPhone ──
let authMail = '';
function normCode(s){ return String(s || '').replace(/\D/g, ''); }
function authErrText(m){
  m = String(m || '');
  const wait = m.match(/after (\d+) seconds/);
  if (wait) return {txt: `Код уже отправлен. Новый можно запросить через ${wait[1]} сек.`, hint: 'Проверь письмо, которое уже пришло, и папку «Спам».'};
  if (/rate|limit/i.test(m)) return {txt: 'Слишком много писем подряд. Подожди немного и попробуй снова.', hint: ''};
  if (/token|expired|otp/i.test(m)) return {txt: 'Код не подошёл или устарел. Проверь цифры или запроси новый.', hint: ''};
  if (/invalid|format|email/i.test(m)) return {txt: 'Почта введена с ошибкой — проверь адрес.', hint: ''};
  return {txt: m || 'Не получилось. Попробуй ещё раз.', hint: ''};
}
function authErr(e){ return e ? `<span class="err">${esc(e.txt)}</span>${e.hint ? `<span class="hint">${esc(e.hint)}</span>` : ''}` : ''; }
function showMailForm(err){
  const bar = document.getElementById('authbar');
  bar.className = 'authbar';
  bar.innerHTML = `${authErr(err)}<input id="mail" type="email" placeholder="почта" autocomplete="email" value="${esc(authMail)}">
    <button id="sendcode">прислать код</button><button id="cancelin" class="ghost">отмена</button>`;
  document.getElementById('mail').focus();
}
function showCodeForm(err){
  const bar = document.getElementById('authbar');
  bar.className = 'authbar';
  bar.innerHTML = `<span class="msg">Код отправлен на ${esc(authMail)}</span>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="код из письма">
    <button id="checkcode">войти</button>${authErr(err)}
    <span class="hint">Письма нет? Загляни в «Спам» · <u id="resend">прислать ещё раз</u> · <u id="cancelin">другая почта</u></span>`;
  document.getElementById('code').focus();
}
async function sendCode(again){
  const mail = again || (document.getElementById('mail').value || '').trim();
  if (!mail) return;
  authMail = mail;
  document.getElementById('authbar').innerHTML = '<span>отправляю…</span>';
  const { error } = await signIn(mail);
  if (error) { const e = authErrText(error.message); return /after \d+ seconds/.test(error.message) ? showCodeForm(e) : showMailForm(e); }
  showCodeForm();
}
async function checkCode(){
  const code = normCode(document.getElementById('code').value);
  if (code.length < 6) return showCodeForm({txt: 'Введи все цифры из письма.', hint: ''});
  document.getElementById('authbar').innerHTML = '<span>проверяю…</span>';
  const { error } = await verifyCode(authMail, code);
  if (error) return showCodeForm(authErrText(error.message));
  authMail = '';
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'mail') sendCode();
  if (e.target.id === 'code') checkCode();
});

document.addEventListener('click', async e => {
  if (e.target.id === 'inbtn') { showMailForm(); return; }
  if (e.target.id === 'cancelin') { authMail = ''; paintAuth(); return; }
  if (e.target.id === 'sendcode') { await sendCode(); return; }
  if (e.target.id === 'resend') { await sendCode(authMail); return; }
  if (e.target.id === 'checkcode') { await checkCode(); return; }
  if (e.target.id === 'demobtn') { startDemo(); return; }
  if (e.target.id === 'demoexit') { location.reload(); return; }
  if (e.target.id === 'outbtn') {
    const pending = wins.filter(w => !w.synced).length + habits.filter(h => !h.synced).length;
    if (pending && !confirm(`Ещё не отправлено в облако: ${pending}. Если выйти сейчас, эти записи сотрутся с устройства. Выйти?`)) return;
    await signOut(); clearLocal(); paintAuth(); render();
  }
});

// ── светлая / тёмная тема ──
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
  + ' stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.3M12 19.3v2.3'
  + 'M21.6 12h-2.3M4.7 12H2.4M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6M18.8 18.8l-1.6-1.6M6.8 6.8L5.2 5.2"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
  + ' stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8'
  + ' 8.6 8.6 0 1 0 20.2 14.6z"/></svg>';

function applyTheme(t, remember){
  document.documentElement.setAttribute('data-theme', t);
  if (remember) { try { localStorage.setItem('pobedy_theme', t); } catch(e){} }
  const btn = document.getElementById('themebtn');
  if (btn) btn.innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON;
  const meta = document.getElementById('tcolor');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#1e1d19' : '#fdfbf0');
}
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') || 'light';
}
document.getElementById('themebtn').onclick = () => {
  applyTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
  render();
};
// пока тему не выбрали руками — следуем за настройкой системы
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  let saved = null;
  try { saved = localStorage.getItem('pobedy_theme'); } catch(err){}
  if (!saved) { applyTheme(e.matches ? 'dark' : 'light'); render(); }
});
// ── боковые поля: приглушённые звёзды летают по прямой и отскакивают от краёв, как заставка; навёл — загорается, нажал — старая суперпобеда или инсайт ──
const DRIFT_MIN_FIELD = 150, DRIFT_SIZE = 64, DRIFT_SPEED = 40;
const drift = {on: false, theme: null, raf: 0, last: 0, stars: [],
  reduce: matchMedia('(prefers-reduced-motion: reduce)').matches};
// что показать: давно не показанное (неделя), среди них — самое давнее; не одно и то же подряд
function recallPick(list, shown, now, rnd){
  if (!list.length) return null;
  let pool = list.filter(w => !shown[w.id] || now - shown[w.id] > 7 * 864e5);
  if (!pool.length) pool = list.slice();
  pool.sort((a, b) => (shown[a.id] || 0) - (shown[b.id] || 0) || new Date(a.d) - new Date(b.d));
  const top = pool.slice(0, Math.max(5, Math.ceil(pool.length * 0.3)));
  return top[Math.floor((rnd || Math.random)() * top.length)];
}
function recallShown(){ try { return JSON.parse(localStorage.getItem('pobedy_recall') || '{}') || {}; } catch(e){ return {}; } }
function driftField(side){
  const r = document.querySelector('.app').getBoundingClientRect();
  return side === 'left' ? {x0: 0, w: r.left} : {x0: r.right, w: innerWidth - r.right};
}
function driftBounds(s){
  const f = driftField(s.side);
  return {f, minX: 10, maxX: Math.max(10, f.w - DRIFT_SIZE - 10), minY: 14, maxY: Math.max(14, innerHeight - DRIFT_SIZE - 34)};
}
function driftPlace(s){
  const b = driftBounds(s);
  if (!s.placed) { s.x = b.minX + Math.random() * (b.maxX - b.minX); s.y = b.minY + Math.random() * (b.maxY - b.minY); s.placed = true; }
  s.x = Math.min(b.maxX, Math.max(b.minX, s.x)); s.y = Math.min(b.maxY, Math.max(b.minY, s.y));
  s.el.style.transform = `translate(${Math.round(b.f.x0 + s.x)}px, ${Math.round(s.y)}px)`;
}
function driftStep(t){
  drift.raf = 0;
  if (document.hidden || !drift.on) { drift.last = 0; return; }
  const dt = drift.last ? Math.min(0.05, (t - drift.last) / 1000) : 0;
  drift.last = t;
  let moving = false;
  drift.stars.forEach(s => {
    if (s.el.hidden || s.hover || !s.card.hidden) return;
    moving = true;
    const b = driftBounds(s);
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.x <= b.minX) s.vx = Math.abs(s.vx); else if (s.x >= b.maxX) s.vx = -Math.abs(s.vx);
    if (s.y <= b.minY) s.vy = Math.abs(s.vy); else if (s.y >= b.maxY) s.vy = -Math.abs(s.vy);
    driftPlace(s);
  });
  if (moving) drift.raf = requestAnimationFrame(driftStep);
}
function driftLoop(){ if (!drift.reduce && !drift.raf && !document.hidden) drift.raf = requestAnimationFrame(driftStep); }
function driftRefresh(){
  if (!drift.on) return;
  const theme = currentTheme(), ok = driftField('left').w >= DRIFT_MIN_FIELD;
  drift.stars.forEach(s => {
    if (drift.theme !== theme) s.el.querySelector('.drift-star').innerHTML = s.kind === 'super' ? star(SUPER_FILL, SUPER, {super: true}) : insightStar();
    s.el.hidden = !ok;
    if (ok) driftPlace(s); else driftHide(s);
  });
  drift.theme = theme;
  if (ok) driftLoop();
}
function driftHide(s){ s.card.hidden = true; if (!s.hover) s.el.classList.remove('lit'); driftLoop(); }
function driftShow(s){
  const today = startOfDay(new Date());
  const list = wins.filter(w => (s.kind === 'super' ? w.super : w.ins) && new Date(w.d) < today);
  const shown = recallShown(), w = recallPick(list, shown, Date.now());
  const kick = s.kind === 'super' ? '⭐ Суперпобеда' : '✦ Инсайт';
  if (!w) {
    s.card.innerHTML = `<button class="dclose" aria-label="Закрыть">×</button><div class="dkick">${kick}</div>
      <p class="dempty">${s.kind === 'super' ? 'Здесь будут твои суперпобеды из прошлого — отметь первую переключателем «Это суперпобеда дня».'
        : 'Здесь будут твои инсайты из прошлого — запиши первый кнопкой «Добавить инсайт».'}</p>`;
  } else {
    const d = new Date(w.d), meta = s.kind === 'super' ? cat(w.s).name
      : (INSIGHT_SECS.find(x => x.id === (w.sec || 'жизнь')) || INSIGHT_SECS[0]).name;
    s.card.innerHTML = `<button class="dclose" aria-label="Закрыть">×</button><div class="dkick">${kick} · ${meta}</div>
      <p class="dtext">${esc(w.t)}</p>
      <div class="dfoot"><small>${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}</small>
        ${list.length > 1 ? '<button class="dmore">ещё одну</button>' : ''}</div>`;
    shown[w.id] = Date.now();
    if (!demoMode) { try { localStorage.setItem('pobedy_recall', JSON.stringify(shown)); } catch(e){} }
  }
  s.card.querySelector('.dclose').onclick = () => driftHide(s);
  const more = s.card.querySelector('.dmore');
  if (more) { if (s.kind === 'insight') more.textContent = 'ещё один'; more.onclick = () => driftShow(s); }
  const b = driftBounds(s), cw = Math.min(270, b.f.w - 24);
  s.card.style.width = cw + 'px';
  s.card.hidden = false;
  const ch = s.card.offsetHeight, below = s.y + DRIFT_SIZE + 34;
  s.card.style.left = Math.round(b.f.x0 + Math.min(b.f.w - cw - 12, Math.max(12, s.x + DRIFT_SIZE / 2 - cw / 2))) + 'px';
  s.card.style.top = Math.round(below + ch < innerHeight - 12 ? below : Math.max(12, s.y - ch - 12)) + 'px';
  s.el.classList.add('lit');
}
function driftInit(){
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  [['super', 'left', 'Вспомнить суперпобеду'], ['insight', 'right', 'Вспомнить инсайт']].forEach(([kind, side, label]) => {
    const el = document.createElement('div');
    el.className = 'drift ' + kind; el.hidden = true;
    el.innerHTML = `<button class="drift-star" aria-label="${label}"></button><span class="drift-lbl">${label}</span>`;
    const card = document.createElement('div');
    card.className = 'dcard ' + kind; card.hidden = true;
    document.body.append(el, card);
    const a = (28 + Math.random() * 34) * Math.PI / 180, sx = Math.random() < .5 ? -1 : 1, sy = Math.random() < .5 ? -1 : 1;
    const s = {kind, side, el, card, x: 0, y: 0, vx: sx * Math.cos(a) * DRIFT_SPEED, vy: sy * Math.sin(a) * DRIFT_SPEED, hover: false, placed: false};
    el.addEventListener('mouseenter', () => { s.hover = true; el.classList.add('lit'); });
    el.addEventListener('mouseleave', () => { s.hover = false; if (s.card.hidden) el.classList.remove('lit'); driftLoop(); });
    el.querySelector('.drift-star').addEventListener('click', () => driftShow(s));
    drift.stars.push(s);
  });
  document.addEventListener('click', e => drift.stars.forEach(s => {
    if (!s.card.hidden && !s.card.contains(e.target) && !s.el.contains(e.target)) driftHide(s); }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') drift.stars.forEach(driftHide); });
  addEventListener('resize', driftRefresh);
  document.addEventListener('visibilitychange', driftLoop);
  drift.on = true;
  driftRefresh();
}
applyTheme(currentTheme());
render();

driftInit();

if (window.supabase) initCloud();
</script>
